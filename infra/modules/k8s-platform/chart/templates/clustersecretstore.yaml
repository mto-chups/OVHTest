apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ovhcloud
spec:
  provider:
    ovh:
      server: {{ required "okmsServer is required" .Values.okmsServer | quote }}
      okmsid: {{ required "okmsId is required" .Values.okmsId | quote }}
      auth:
        mtls:
          certSecretRef:
            name: ovhcloud-mtls
            namespace: {{ .Values.externalSecretsNamespace | quote }}
            key: tls.crt
          keySecretRef:
            name: ovhcloud-mtls
            namespace: {{ .Values.externalSecretsNamespace | quote }}
            key: tls.key
