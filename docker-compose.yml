services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: .
    command: ["node", "dist/server/index.js"]
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-deployment_test}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      REDIS_URL: redis://redis:6379
      MS1_URL: http://microservice-1:3001
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  microservice-1:
    build: .
    command: ["node", "dist/microservice-1/index.js"]
    environment:
      PORT: 3001
      SERVER_URL: http://server:3000
    depends_on:
      - server

  microservice-2:
    build: .
    command: ["node", "dist/microservice-2/index.js"]
    environment:
      SERVER_URL: http://server:3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-deployment_test}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
    depends_on:
      server:
        condition: service_started

  microservice-3:
    build: .
    command: ["node", "dist/microservice-3/index.js"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
