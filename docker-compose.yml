services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ovhtest
      POSTGRES_USER: ovhtest_admin
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovhtest_admin -d ovhtest"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/migrate/index.js"]
    environment: &database-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ovhtest_admin
      DB_PASSWORD: local-only-password
      DB_NAME: ovhtest
      DB_SSL: "false"
      DB_RUNTIME_USER: ovhtest_admin
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: .
    command: ["node", "dist/server/index.js"]
    environment:
      PORT: 3000
      <<: *database-environment
      REDIS_URL: redis://redis:6379
      REDIS_TLS_REQUIRED: "false"
      REDIS_PREFIX: ovhtest
      MS1_URL: http://microservice-1:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  microservice-1:
    build: .
    command: ["node", "dist/microservice-1/index.js"]
    environment:
      PORT: 3001
      SERVER_URL: http://server:3000
    depends_on:
      - server

  microservice-2:
    build: .
    command: ["node", "dist/microservice-2/index.js"]
    environment:
      MS2_PORT: 3002
      SERVER_URL: http://server:3000
      <<: *database-environment
    depends_on:
      server:
        condition: service_started

  microservice-3:
    build: .
    command: ["node", "dist/microservice-3/index.js"]
    environment:
      MS3_PORT: 3003
      REDIS_URL: redis://redis:6379
      REDIS_TLS_REQUIRED: "false"
      REDIS_PREFIX: ovhtest
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
